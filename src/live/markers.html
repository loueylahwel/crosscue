<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CROSSCUE Markers</title>
    <link rel="stylesheet" href="./live.css" />
    <style id="page-size">@page { size: A4 portrait; margin: 10mm; }</style>
    <style>
      .controls label { display: inline-flex; gap: 6px; align-items: center; }
      .controls input[type='number'] { width: 80px; }
      #sheets { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 8px 0 40px; }
      .sheet { background: #fff; color: #000; box-shadow: 0 2px 18px rgba(0, 0, 0, 0.5); padding: 10mm;
        display: flex; flex-direction: column; align-items: center; font: 11pt/1.35 system-ui, 'Segoe UI', sans-serif; }
      .sheet h3 { margin: 0 0 3mm; font-size: 15pt; letter-spacing: 0.04em; }
      .sheet .frame svg { display: block; }
      .sheet .info { display: flex; gap: 5mm; align-items: center; }
      .sheet .info svg { flex: none; }
      .sheet .note { text-align: left; }
      .sheet .meta { margin-top: 2mm; color: #555; font-size: 9pt; text-align: center; }
      .sheet .ruler { margin-top: 4mm; height: 3mm; border: 0.3mm solid #000; border-top: none; position: relative; }
      .sheet .ruler span { position: absolute; left: 0; right: 0; top: 3.5mm; text-align: center; font-size: 8.5pt; color: #444; }
      @media print {
        :root { color-scheme: light; }
        html, body { background: #fff; }
        main.screen-only { display: none; }
        #sheets { padding: 0; gap: 0; display: block; }
        .sheet { box-shadow: none; padding: 0; break-after: page; width: auto !important; min-height: 0 !important; }
      }
    </style>
  </head>
  <body>
    <main class="screen-only">
      <h1>CROSSCUE marker sheets</h1>
      <p class="dim">
        Two printed markers for FTX. Print this page at <b>100% / Actual size</b> (not "fit to page"), then measure each
        black square with a ruler and type the measured size into the observer. The 100 mm line under each marker is a
        quick check that the printer did not scale.
      </p>
      <div class="row controls">
        <label>Paper <select id="paper"><option>A4</option><option>Letter</option><option>A3</option></select></label>
        <label>Origin square <input id="size0" type="number" min="40" max="270" step="5" /> mm</label>
        <label>Target square <input id="size1" type="number" min="40" max="270" step="5" /> mm</label>
        <button id="print" class="primary">Print</button>
      </div>
      <p id="warn" class="warn"></p>
    </main>
    <div id="sheets"></div>
    <script type="module" src="./markers.ts"></script>
  </body>
</html>
